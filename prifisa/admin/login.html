<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acceso admin | PRIFISA</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.0/index.css" />
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="../index.html" class="nav-logo" style="display:flex;"><span>PRIFISA</span></a>
    <h1>Panel de publicaciones</h1>
    <p class="auth-sub">Inicia sesión para gestionar el blog</p>

    <div class="auth-error" id="authError">Email o contraseña incorrectos.</div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">
        Iniciar sesión
      </button>
    </form>

    <a href="../index.html" class="auth-back">← Volver al sitio</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/js/supabase-config.js?v=1"></script>
<script>
  const loginForm = document.getElementById('loginForm');
  const authError = document.getElementById('authError');
  const loginBtn = document.getElementById('loginBtn');

  // Si ya hay sesión activa, ir directo al panel
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = 'panel.html';
  })();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.classList.remove('show');
    loginBtn.disabled = true;
    loginBtn.textContent = 'Entrando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      authError.textContent = 'Email o contraseña incorrectos.';
      authError.classList.add('show');
      loginBtn.disabled = false;
      loginBtn.textContent = 'Iniciar sesión';
      return;
    }

    window.location.href = 'panel.html';
  });
</script>

</body>
</html>
